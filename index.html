@keyframes sp{to{transform:rotate(1turn)}}@keyframes gl{to{opacity:.45}}@keyframes fi{from{opacity:0}}@keyframes pp{from{opacity:0;transform:scale(.96)}}
body.nomo *,body.nomo *::before{animation:none!important;transition:none!important}.logo .i,.brand>.i,.seg button.on .i{color:var(--a)}.sr>.i,.empty .i{color:var(--m)}.box>input{margin:6px 0}.rq{border-left:3px solid var(--a);padding:2px 8px;margin:2px 0;color:var(--m);font-size:12.5px;background:var(--h);border-radius:0 8px 8px 0;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpl{display:flex;align-items:center;gap:10px;margin:0 18px;padding:6px 12px;background:var(--p);border:1px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0}.rpl+.comp{border-top-left-radius:0;border-top-right-radius:0;margin-top:0}
#main{position:relative}#ep{position:absolute;bottom:84px;left:60px;width:340px;background:var(--bx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 30px #0006;padding:8px;z-index:6}
.et{display:flex;gap:4px;border-bottom:1px solid var(--bd);padding-bottom:6px}.et span,.eg span{cursor:pointer;border-radius:8px;padding:3px 6px;font-size:20px}.et span:hover,.eg span:hover,.et span.on{background:var(--h)}
.eg{display:grid;grid-template-columns:repeat(8,1fr);max-height:220px;overflow:auto;padding-top:6px}.eg span{text-align:center}.ast .card{flex:1;align-items:center;text-align:center;margin:0}.ast b{font-size:22px}

.gb.u{background:var(--a);color:#fff;align-self:flex-end;max-width:90%}.gb.m{background:var(--bg);border:1px solid var(--bd)}.gq{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.gq button{padding:5px 10px;font-size:12px}

.pl{cursor:pointer}.pc{margin:-20px -20px 0}.pb{height:110px;background:linear-gradient(135deg,var(--a),#eb459e) center/cover;border-radius:16px 16px 0 0}.pp{margin-top:-34px;display:flex;align-items:flex-end;gap:12px}
.rec{background:#da373c!important;color:#fff}.rp{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:4px}.rp img{max-width:220px;border-radius:8px}.mb audio{max-width:280px;height:38px;margin-top:4px}
body.compact .m.f{margin-top:6px}body.compact .m{padding:0 22px}
</style>
<body>
<div id=corner><button id=lo class=g onclick=logout()>Log ud</button><button id=av2 class=g onclick=adv()></button></div>
<div id=boot class=c><div class=spin></div><div id=bt style="text-align:center">Forbinder…</div></div>
<div id=lock class=c><div class=logo></div><h2>Master Debate</h2><div id=lu style="font-size:18px;text-align:center"></div><input id=code type=password placeholder="Kode" onkeydown="event.key=='Enter'&&unlock()"><button onclick=unlock()>Åbn</button><small class=err></small></div>
<div id=login class=c><div class=logo></div><h2>Master Debate</h2><input id=nm placeholder="Brugernavn"><input id=pw type=password placeholder="Adgangskode" onkeydown="event.key=='Enter'&&login(0)"><input id=ic type=password placeholder="Invitationskode (kun ved ny konto)"><div class=row><button onclick=login(0)>Log ind</button><button class=g onclick=login(1)>Opret konto</button></div><small class=err></small></div>
<div id=app><div id=side></div><div id=main></div><div id=gp></div></div><div id=cb></div><div id=modal></div>
<script src="icons.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let typers={},lt=0;const RE=['👍','❤️','😂','😮','😢','🔥'];document.body.dataset.theme=localStorage.th||'';
let ws,S=null,cur=null,tab='chats',code='',off=0,unread={},sel='none';
const DECOS={none:'Ingen',gold:'Guld',rainbow:'Regnbue',neon:'Neon',fire:'Ild',ice:'Is',toxic:'Gift',sakura:'Sakura',galaxy:'Galakse'};
const P=n=>S.people[n]||{emoji:'?',color:'#555',deco:'none'};
const av=(p,dot)=>`<div class="avw d-${esc(p.deco)}"><div class=av style="background:${esc(p.color)}">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.emoji)}" referrerpolicy=no-referrer onerror="this.replaceWith(this.alt)">`:esc(p.emoji)}</div>${dot?`<i class="${p.online?'on':''}"></i>`:''}</div>`;
const err=t=>document.querySelectorAll('.err').forEach(x=>x.textContent=t||'');
const show=id=>{['boot','lock','login','app'].forEach(x=>$('#'+x).style.display=x==id?'flex':'none');$('#corner').style.display=id=='app'?'none':'flex';$('#lo').style.display=id=='lock'?'':'none'};
const tx=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
const rname=r=>r.type=='group'?r.name:r.members.find(x=>x!=S.me.name);
const room=id=>S.rooms.find(r=>r.id==id);
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2500)};
const DEFAULT_SERVER=''; // skriv evt. din Render-adresse her, fx 'besked-server.onrender.com'
const norm=u=>{u=(u||'').trim();return u?u.replace(/^http/,'ws').replace(/^(?!wss?:)/,'wss://'):''};
let srv=norm(localStorage.srv2||DEFAULT_SERVER),booting=0,auto=0,upDone=0;
function dial(url){return new Promise((ok,no)=>{let w;try{w=new WebSocket(url)}catch{return no()}
  const t=setTimeout(()=>{w.onclose=w.onerror=w.onopen=null;w.close();no()},20000);
  w.onopen=()=>{clearTimeout(t);ws=w;w.onmessage=e=>on(JSON.parse(e.data));w.onclose=()=>{S=null;boot()};ok()};
  w.onerror=()=>{clearTimeout(t);no()}})}
async function boot(skip){if(booting)return;booting=1;cur=null;closeM();show('boot');if(call)leaveCall(1);
  if(window.api&&!upDone&&!sessionStorage.skipup){upDone=1;$('#bt').textContent='Tjekker for opdateringer…';const r=await window.api.update();if(r=='installing'){$('#bt').textContent='App opdaterer…';await new Promise(()=>{})}}
  if(!srv){booting=0;$('#bt').textContent='Vælg en server under Avanceret';return adv()}
  const bt=$('#bt');bt.textContent='Forbinder…';const t=setTimeout(()=>bt.textContent='Server starter… (kan tage op til et minut)',2500);
  for(;;){try{await dial(srv);break}catch{await new Promise(r=>setTimeout(r,2500))}}
  clearTimeout(t);booting=0;const u=localStorage.user;
  if(u&&localStorage.tok&&!skip){auto=1;bt.textContent='Logger ind…';tx({t:'auth',name:u,token:localStorage.tok})}
  else if(u){$('#lu').textContent=u;show('lock');$('#code').focus()}else{show('login');$('#nm').focus()}}
const send1=o=>{if(!ws||ws.readyState!=1)return boot();err();tx(o)};
const unlock=()=>send1({t:'auth',name:localStorage.user,pw:$('#code').value});
const login=su=>send1({t:'auth',signup:su,code:$('#ic').value,name:$('#nm').value.trim(),pw:$('#pw').value});
function lock(e){S=null;unread={};badge();closeM();if(ws){ws.onclose=null;ws.close()}$('#code').value=$('#pw').value='';err(e);boot(1)}
const logout=()=>{if(S&&localStorage.tok)tx({t:'forget',token:localStorage.tok});delete localStorage.tok;delete localStorage.user;lock()};
function adv(){modal(`<h3>Avancerede indstillinger</h3><small>Server-adresse</small><input id=sv value="${esc(srv)}" placeholder="fx besked-server.onrender.com"><div class=row><button class=g onclick=closeM()>Annullér</button><button onclick=saveAdv()>Gem og forbind</button></div>`)}
const saveAdv=()=>{srv=norm($('#sv').value);localStorage.srv2=srv;closeM();if(ws){ws.onclose=null;ws.close()}S=null;boot()};
const hx=c=>/^#[0-9a-f]{6}$/i.test(c||'');
function applyBg(){const a=localStorage.g1,b=localStorage.g2,on=hx(a)&&hx(b)&&localStorage.gon=='1';document.body.classList.toggle('grad',on);document.body.style.setProperty('--grad',on?`linear-gradient(${+localStorage.ga||135}deg,${a},${b})`:'none')}
function on(m){
  if(m.t=='err'){err(m.e);if(auto){auto=0;delete localStorage.tok;$('#lu').textContent=localStorage.user||'';show(localStorage.user?'lock':'login')}}
  else if(m.t=='note')toast(m.e);
  else if(m.t=='admin')adminUI(m);
  else if(m.t=='score'){if(S&&S.people[m.u])S.people[m.u].score=m.score;if(S&&m.u==S.me.name){S.me.score=m.score;const e=$('#sc');if(e)e.textContent=`${lvl(m.score)} · ${m.score} point`}}
  else if(m.t=='sig')onSig(m)
  else if(m.t=='callstate')callState(m)
  else if(m.t=='token'){localStorage.tok=m.token;toast('Auto-login er slået til')}
  else if(m.t=='state'){S=m;auto=0;localStorage.user=m.me.name;$('#pw').value=$('#code').value=$('#ic').value='';err();off=m.now-Date.now();if(cur&&!room(cur))cur=null;show('app');render()}
  else if(!S)return;
  else if(m.t=='msg'){const r=room(m.room);if(!r)return;r.messages.push(m.m);if(m.m.u!=S.me.name){if(pf().sound!==0)beep();if(pf().notif!==0&&!document.hasFocus())new Notification(m.m.u,{body:m.m.text||'Fil'})}if(m.m.u!=S.me.name&&!(cur==r.id&&tab=='chats'&&document.hasFocus()))unread[r.id]=(unread[r.id]||0)+1;if(cur==r.id&&tab=='chats')msgs();list()}
  else if(m.t=='typing'){(typers[m.room]=typers[m.room]||{})[m.u]=Date.now()+3000;showTy()}
  else if(m.t=='upd'){const r=room(m.room),g=r&&r.messages.find(x=>x.id==m.id);if(g){g.text=m.text;g.edited=m.edited;g.r=m.r;cur==r.id&&msgs()}}
  else if(m.t=='del'){const r=room(m.room);if(r){r.messages=r.messages.filter(x=>!m.ids.includes(x.id));cur==r.id&&msgs()}}
  else if(m.t=='wiped'){const r=room(m.room);if(r){r.messages=[];cur==r.id&&msgs()}}}
const render=()=>{side();main();callbar()};
const openR=id=>{if(cur!=id&&$('#in'))$('#in').value='';cur=id;tab='chats';delete unread[id];rep=null;render();badge()};
const dm=n=>{const r=S.rooms.find(r=>r.type=='dm'&&r.members.includes(n));r&&openR(r.id)};
const addF=()=>{tx({t:'friend',name:$('#fn').value});$('#fn').value=''};
let ik=0,q='',rep=null,ec='😀',call=null,rec=null,gh=[],gc=false,ign={},aTab='o',lastA=null;
const ico=(n,z=20)=>IC[n]?`<span class=i>${IC[n].replace('<svg ',`<svg width="${z}" height="${z}" `)}</span>`:'';
const pf=()=>{try{return JSON.parse(localStorage.prefs||'{}')}catch{return{}}};
function applyPf(){const p=pf(),b=document.body;b.dataset.theme=p.theme||'';b.classList.toggle('compact',!!p.compact);b.classList.toggle('nomo',p.motion===0);b.style.fontSize=({s:'13px',l:'15.5px'})[p.font]||'14px';b.style.setProperty('--a',hx(p.accent)?p.accent:'#5865f2')}
const setPf=(k,v)=>{const p=pf();p[k]=v;localStorage.prefs=JSON.stringify(p);applyPf()};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch{}};
const T=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const rinfo=r=>{const g=r.type=='group';return{g,n:rname(r),p:g?{emoji:'👥',color:'#4e5058',deco:'none',img:r.img}:P(rname(r))}};

async function cam(){if(!cur)return;let st;try{st=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}})}catch{return toast('Kamera blev ikke fundet eller er ikke tilladt')}
shot=0;modal(`<h3>Tag et billede</h3><video id=cv autoplay playsinline muted style="width:100%;border-radius:12px;background:#000"></video><canvas id=cc hidden style="width:100%;border-radius:12px"></canvas><div class=row><button class=g onclick=closeM()>Annullér</button><button class=g id=cn hidden onclick=camAgain()>Tag nyt</button><button id=cs onclick=camShot()>${ico('camera',18)}Tag billede</button></div>`);window._cst=st;$('#cv').srcObject=st}
function camShot(){const v=$('#cv'),c=$('#cc');if(!shot){c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);shot=1;v.hidden=true;c.hidden=false;$('#cn').hidden=false;$('#cs').innerHTML=ico('send',18)+'Send'}
else{const d=c.toDataURL('image/jpeg',.82);if(d.length>2e6)return toast('Billedet er for stort');tx({t:'msg',room:cur,text:'',file:{name:'foto.jpg',data:d}});closeM()}}
const camAgain=()=>{shot=0;$('#cv').hidden=false;$('#cc').hidden=true;$('#cn').hidden=true;$('#cs').innerHTML=ico('camera',18)+'Tag billede'};
const recUI=()=>{const b=$('#mic'),x=$('#micx');if(!b)return;b.classList.toggle('rec',!!rec);b.innerHTML=rec?ico('stop',22)+' '+Math.round((Date.now()-rec.t0)/1000)+'s':ico('mic',22);if(x)x.hidden=!rec};
async function recStart(){if(!cur)return;try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st,{audioBitsPerSecond:24000}),ch=[];
mr.ondataavailable=e=>ch.push(e.data);
mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const send=rec&&rec.send,room=cur;clearInterval(rec&&rec.tm);rec=null;recUI();
if(send){const b=new Blob(ch,{type:'audio/webm'});if(b.size>1.5e6)return toast('Talebeskeden er for lang');const rd=new FileReader();rd.onload=()=>tx({t:'msg',room,text:'',file:{name:'Talebesked.webm',data:rd.result}});rd.readAsDataURL(b)}};
rec={mr,t0:Date.now()};mr.start();rec.tm=setInterval(()=>{recUI();if(Date.now()-rec.t0>120000)recStop(1)},500);recUI()}catch{toast('Mikrofon blev ikke fundet eller er ikke tilladt')}}
const recStop=send=>{if(rec){rec.send=send;rec.mr.stop()}},recToggle=()=>rec?recStop(1):recStart();
async function joinCall(room){if(call)return toast('Du er allerede i et opkald');let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch{return toast('Mikrofon blev ikke fundet eller er ikke tilladt')}
call={room,pcs:{},aud:{},stream:st,muted:false};ign[room]=0;tx({t:'calljoin',room});callbar()}
function mkpc(peer){const pc=new RTCPeerConnection({iceServers:S.ice});call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
pc.onicecandidate=e=>e.candidate&&tx({t:'sig',room:call.room,to:peer,data:{c:e.candidate}});
pc.ontrack=e=>{let a=call.aud[peer];if(!a){a=call.aud[peer]=new Audio();a.autoplay=true}a.srcObject=e.streams[0]};call.pcs[peer]=pc;return pc}
async function offer(peer){if(!call)return;const pc=mkpc(peer);await pc.setLocalDescription(await pc.createOffer());tx({t:'sig',room:call.room,to:peer,data:{o:pc.localDescription}})}
function onSig(m){if(!S||!call||call.room!=m.room)return;const pc=call.pcs[m.from]||mkpc(m.from);
pc.q=(pc.q||Promise.resolve()).then(async()=>{const d=m.data;
if(d.o){await pc.setRemoteDescription(d.o);await pc.setLocalDescription(await pc.createAnswer());tx({t:'sig',room:call.room,to:m.from,data:{a:pc.localDescription}})}
else if(d.a)await pc.setRemoteDescription(d.a);else if(d.c)await pc.addIceCandidate(d.c)}).catch(()=>{})}
function callState(m){if(!S)return;S.calls=S.calls||{};const was=(S.calls[m.room]||[]).length;S.calls[m.room]=m.users;
if(call&&call.room==m.room){if(m.joiner==S.me.name)m.users.filter(x=>x!=S.me.name).forEach(offer);
Object.keys(call.pcs).filter(p=>!m.users.includes(p)).forEach(p=>{call.pcs[p].close();delete call.pcs[p];if(call.aud[p])call.aud[p].srcObject=null})}
else if(!call&&!was&&m.users.length&&!m.users.includes(S.me.name)){beep();setTimeout(beep,450);setTimeout(beep,900)}callbar()}
function leaveCall(q){if(!call)return;Object.values(call.pcs).forEach(p=>p.close());Object.values(call.aud).forEach(a=>a.srcObject=null);call.stream.getTracks().forEach(t=>t.stop());if(!q)tx({t:'callleave',room:call.room});call=null;callbar()}
const muteCall=()=>{call.muted=!call.muted;call.stream.getAudioTracks().forEach(t=>t.enabled=!call.muted);callbar()};
function callbar(){const e=$('#cb');if(!e)return;if(!S){e.innerHTML='';e.style.display='none';return}const C=S.calls||{};
if(call){const r=room(call.room);e.innerHTML=`<span>${ico('phone',18)} I opkald · ${esc(r?rname(r):'')} · ${(C[call.room]||[]).length}</span><button class=g onclick=muteCall()>${call.muted?'Slå lyd til':'Mute'}</button><button class=r onclick=leaveCall()>Læg på</button>`}
else e.innerHTML=Object.entries(C).filter(([id,u])=>u.length&&!ign[id]&&room(id)).map(([id,u])=>`<span>${ico('phone',18)} Opkald i ${esc(rname(room(id)))} (${u.map(esc).join(', ')})</span><button onclick="joinCall('${id}')">Deltag</button><button class=g onclick="ign['${id}']=1;callbar()">Ignorér</button>`).join('');
e.style.display=e.innerHTML?'flex':'none'}
const gOn=()=>$('#gp').classList.contains('on'),gToggle=()=>{$('#gp').classList.toggle('on');gRender()};
function gRender(){const p=$('#gp');if(!gOn())return;const key=localStorage.gkey;
p.innerHTML=`<div class=hd><b style="flex:1">${ico('sparkle',20)} Gemini</b><button class=ib title="Indstillinger" onclick=gCfg()>${ico('settings',20)}</button><button class=ib onclick=gToggle()>${ico('circle-x',20)}</button></div>`+(key?
`<div class=gm id=gm>${gh.map((g,i)=>g.role=='user'?`<div class="gb u">${esc(g.parts[0].text)}</div>`:`<div class="gb m">${esc(g.parts[0].text)}${cur&&g.parts[0].text!='…'?`<br><button class=g style="margin-top:6px;padding:4px 10px;font-size:12px" onclick="gIns(${i})">Indsæt i chat</button>`:''}</div>`).join('')||'<small>Spørg om hvad som helst, eller brug genvejene herunder.</small>'}</div>

:`<div class=pad style="padding:16px"><small>Indsæt din gratis API-nøgle fra aistudio.google.com/apikey. Den gemmes kun på denne pc.</small><input id=gk type=password placeholder="Gemini API-nøgle" style="margin:10px 0"><button onclick=gSave()>Gem nøgle</button></div>`);

function gCfg(){modal(`<h3>Gemini-indstillinger</h3><small>Nøglen gemmes kun på denne pc og sendes direkte til Google. Hent en gratis nøgle på aistudio.google.com/apikey.</small><input id=gk type=password placeholder="API-nøgle" value="${esc(localStorage.gkey||'')}"><input id=gmo list=gml placeholder="Model" value="${esc(localStorage.gmodel||'gemini-2.5-flash')}"><datalist id=gml><option value=gemini-2.5-flash><option value=gemini-2.5-flash-lite><option value=gemini-2.5-pro></datalist><small>Når du deler beskeder, sendes de til Google. På gratisniveauet kan Google bruge input til at forbedre sine produkter.</small><div class=row><button class=r onclick="delete localStorage.gkey;gh=[];closeM();gRender()">Fjern nøgle</button><button onclick="localStorage.gkey=$('#gk').value.trim();localStorage.gmodel=$('#gmo').value.trim()||'gemini-2.5-flash';closeM();gRender()">Gem</button></div>`)}
async function gAsk(q,ctx){const key=localStorage.gkey;if(!key)return gRender();gc=$('#gctx')?$('#gctx').checked:gc;
let sys='Du er en hjælpsom assistent ved siden af chatappen Master Debate. Svar kort og på samme sprog som brugeren.';
if(ctx&&cur)sys+='\n\nSeneste beskeder i samtalen:\n'+room(cur).messages.slice(-30).map(m=>m.u+': '+(m.text||'[fil]')).join('\n');
gh.push({role:'user',parts:[{text:q}]});gh.push({role:'model',parts:[{text:'…'}]});gRender();const i=gh.length-1;let c=gh.slice(0,-1).slice(-12);while(c.length&&c[0].role!='user')c.shift();
try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(localStorage.gmodel||'gemini-2.5-flash')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:c})});
const j=await r.json();gh[i].parts[0].text=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts.map(p=>p.text).join(''))||'Fejl: '+((j.error&&j.error.message)||'intet svar')}catch{gh[i].parts[0].text='Fejl: kunne ikke nå Gemini (tjek internettet og nøglen).'}gRender()}
