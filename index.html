function setCbgFile(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,i.naturalWidth*k|0);c.height=Math.max(1,i.naturalHeight*k|0);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
try{localStorage.cbgimg=c.toDataURL('image/jpeg',.8);setCbg('custom');const t=document.querySelector('.bgt[data-k=custom]');if(t)t.setAttribute('style',cbgCustom())}catch{toast('Billedet er for stort')}};i.src=rd.result};rd.readAsDataURL(f)}
function applyChatBg(){const w=$('.mw');if(!w)return;const p=pf().cbg||'none';let bg='',col='',snow=0,ov=0;
if(p=='snow'){bg='linear-gradient(180deg,#1a1f5c,#3d4fd6 60%,#8fa0ff)';snow=1}else if(p=='mascot'){bg="url('winter.jpg')";ov=1}else if(p=='aurora')bg='linear-gradient(135deg,#0f2027,#2c7a7b,#6a3093)';
else if(p=='custom'){if(localStorage.cbgimg){bg=`url('${localStorage.cbgimg}')`;ov=1}else col=pf().cbgc||'#1e1f22'}
w.style.backgroundImage=bg;w.style.backgroundColor=col;w.classList.toggle('hasbg',!!(bg||col));w.classList.toggle('ov',!!ov);snowStart(snow)}
function snowStart(on){const c=$('#snow');cancelAnimationFrame(snowRaf);snowRaf=0;if(!c)return;c.style.display=on?'block':'none';if(!on)return;const x=c.getContext('2d'),W=()=>{c.width=c.clientWidth||c.parentNode.clientWidth||600;c.height=c.clientHeight||c.parentNode.clientHeight||400};W();
if(!flakes.length)flakes=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,v:.2+Math.random()*.8,d:Math.random()*6}));
const draw=()=>{if($('#snow')!==c)return;if(c.width!=c.clientWidth||c.height!=c.clientHeight)W();x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.88)';
flakes.forEach(f=>{f.y+=f.v*.0016;f.d+=.02;f.x+=Math.sin(f.d)*.0006;if(f.y>1.02){f.y=-.02;f.x=Math.random()}x.beginPath();x.arc(f.x*c.width,f.y*c.height,f.r,0,7);x.fill()});
if(!document.body.classList.contains('nomo'))snowRaf=requestAnimationFrame(draw)};draw()}

function vadAttach(k,stream){if(!call||!stream||!stream.getAudioTracks().length)return;try{if(!call.ac){call.ac=new AudioContext();if(call.ac.resume)call.ac.resume()}const an=call.ac.createAnalyser();an.fftSize=512;call.ac.createMediaStreamSource(stream).connect(an);(call.ana=call.ana||{})[k]={an,d:new Uint8Array(an.fftSize),hold:0}}catch{}

function vadTick(){if(!call)return;const t=Date.now();let ch=false;call.sp=call.sp||{};for(const[k,a]of Object.entries(call.ana||{})){a.an.getByteTimeDomainData(a.d);let m=0;for(const x of a.d)m=Math.max(m,Math.abs(x-128));if(m>14)a.hold=t+350;const on=t<a.hold&&!(k=='me'&&call.muted);if(call.sp[k]!==on){call.sp[k]=on;ch=true}}if(ch)vadApply()}
